project:
  name: neurosymbolic-iot-pipeline
  seed: 42

paths:
  raw_root: data/raw
  processed_root: data/processed
  logs_root: logs

datasets:
  casas:
    # Kyoto ADL Errors dataset root (contains adl_error/ and adl_noerror/)
    raw_dir: data/raw/casas_kyoto_adl

    # Tell the pipeline which loader/layout to use
    format: kyoto_adl_errors

    file_globs:
      - "adl_error/*.csv"
      - "adl_noerror/*.csv"

    timezone: "UTC"

    # Windowing
    window_minutes: 30
    stride_minutes: 5
    min_events_per_window: 1

    # Features/labels
    feature_mode: "event_counts"
    label_mode: "majority"
    label_column_candidates: ["activity", "label", "Activity", "Label"]

  sphere:
    raw_dir: data/raw/sphere
    file_globs: ["**/*.csv", "**/*.tsv"]
    # Windowing for SPHERE is seconds-based (multimodal alignment is dataset-specific)
    label_file_preference: ["activity.csv"]
    stream_file_preference: ["acceleration_corrected.csv", "acceleration.csv", "accel.csv", "pir.csv"]
    time_column_candidates: ["t", "timestamp", "time", "ts", "datetime"]
    label_join_tolerance_seconds: 10
    window_seconds: 30
    stride_seconds: 15
    min_rows_per_window: 5
    # Splits
    split:
      train: 0.7
      val: 0.15
      test: 0.15
      stratify: true
      seed: 42

output:
  casas_windows: data/processed/casas_windows.parquet
  casas_meta: data/processed/casas_meta.json
  sphere_windows: data/processed/sphere_windows.parquet
  sphere_meta: data/processed/sphere_meta.json


neural_perception:
  output_dir: outputs/neural_perception
  device: auto

  casas:
    window_minutes: 30
    stride_minutes: 5
    min_events: 1
    max_seq_len: 256
    emb_dim: 64
    hidden_size: 128
    num_layers: 1
    dropout: 0.1
    batch_size: 32
    epochs: 30
    lr: 0.001
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15

  sphere:
    window_seconds: 30
    stride_seconds: 15
    min_rows: 10
    seq_len: 128
    hidden_size: 128
    num_layers: 1
    dropout: 0.2
    batch_size: 64
    epochs: 40
    lr: 0.001
    train_ratio: 0.7
    val_ratio: 0.15
    test_ratio: 0.15

kg:
  ontology_path: neurosymbolic_iot/kg_semantic_layer/ontology/Neuro-Symbolic IoT Smart Home Ontology.ttl
  rules_path: neurosymbolic_iot/kg_semantic_layer/ontology/NeuroSymbolic_IoT_SmartHome_Ontology_SWRL_Rules.ttl
  sensor_map_path: neurosymbolic_iot/kg_semantic_layer/ontology/sensor_map.json
  output_dir: outputs/kg
  serialization_format: turtle
  graphdb:
    enabled: false
    endpoint: "http://localhost:7200"
    repository: "neurosymbolic-iot"

reasoning:
  confidence_threshold_validation: 0.85
  confidence_threshold_anomaly: 0.85
  confidence_threshold_feedback: 0.70
  output_dir: outputs/reasoning
  reasoner: hermit  # hermit (Java 11+, default) | pellet (Java 25+, requires alternative CLI for full SWRL)

feedback:
  max_cycles: 5
  retrain_buffer_size: 500
  retrain_trigger_size: 100
  confidence_adjustment_rate: 0.05
  output_dir: outputs/feedback

pipeline:
  enable_neural: true
  enable_kg: true
  enable_symbolic: true
  enable_feedback: true

logging:
  level: INFO
